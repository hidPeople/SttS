<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="editor-token" content="__TOKEN__"><title>SttS | データ工房</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand"><span class="mark">S</span><div><strong>SttS データ工房</strong><small>GAME DATA EDITOR · LOCAL</small></div></div><div class="actions"><button id="refresh">最新の情報に更新</button><button id="validate">入力内容整合チェック</button><button id="build">ビルド実行</button><button id="apply" class="primary">ビルドして適用</button><button id="apply-no-build">ビルドせず適用</button></div></header>
<div id="notice" role="status">ソースを読み込んでいます…</div><div class="tab-bar"><nav id="tabs" aria-label="データ種別"></nav><button id="discard" class="danger">このファイルの下書きを破棄</button></div>
<main><aside><input id="search" placeholder="データ名・キーを検索" aria-label="データを検索"><div id="declarations"></div></aside>
<section class="workspace"><div class="workspace-title"><div><small id="filename"></small><h1 id="heading">データを選択</h1></div><button id="filemode">ファイル全体を編集</button></div><div id="drift"></div><div id="sprite"></div><div id="form"></div></section>
<section class="code-pane"><div class="code-title"><strong>TypeScript / 実装結果</strong></div><p>ボタンで明示的に相互反映します。オブジェクト欄では <code>categories: ['attack', 'noMotion'],</code> のようなプロパティ記法も使えます。</p><button id="source-refresh">実装結果を更新</button><small id="code-note"></small><textarea id="source" spellcheck="false" aria-label="TypeScript入力"></textarea><div class="actions code-actions"><button id="parse" class="primary">入力を解析してフォームへ反映</button><button id="discard-code" class="danger">未反映のTS入力を破棄</button></div><small>手入力はブラウザに保存します。自動解析はしません。反映ボタンで下書きへ反映できます。不要な入力は破棄できます。</small><div id="issues" aria-live="polite"></div></section></main>
<dialog id="dialog"><h2 id="dialog-title"></h2><div id="dialog-issues"></div><pre id="dialog-log"></pre><div class="actions"><button id="copy-log">内容をコピー</button><button id="close-dialog" class="primary">閉じる</button></div></dialog>
<div id="hover-help" role="tooltip" hidden></div>
<script src="/app.js" type="module"></script></body></html>
