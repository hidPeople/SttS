<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="editor-token" content="__TOKEN__"><title>SttS | データ工房</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div class="brand"><span class="mark">S</span><div><strong>SttS データ工房</strong><small>GAME DATA EDITOR · LOCAL</small></div></div><div class="actions"><button id="refresh">最新の情報に更新</button><button id="validate">型をチェック</button><button id="apply" class="primary">本体へ適用・ビルド</button></div></header>
<div id="notice" role="status">ソースを読み込んでいます…</div><nav id="tabs" aria-label="データ種別"></nav>
<main><aside><input id="search" placeholder="データ名・キーを検索" aria-label="データを検索"><div id="declarations"></div><button id="discard" class="danger">このファイルの下書きを破棄</button></aside>
<section class="workspace"><div class="workspace-title"><div><small id="filename"></small><h1 id="heading">データを選択</h1></div><button id="filemode">ファイル全体を編集</button></div><div id="drift"></div><div id="sprite"></div><div id="form"></div></section>
<section class="code-pane"><div class="code-title"><strong>TypeScript / 実装結果</strong><span id="code-state"></span></div><p>フォームと相互反映。オブジェクト欄では <code>categories: ['attack', 'noMotion'],</code> のようなプロパティ記法も使えます。</p><textarea id="source" spellcheck="false" aria-label="TypeScript入力"></textarea><button id="parse" class="primary">入力を解析してフォームへ反映</button><small>未解析の入力もブラウザに保存します。適用前に解析します。</small><div id="issues" aria-live="polite"></div></section></main>
<dialog id="dialog"><h2 id="dialog-title"></h2><pre id="dialog-log"></pre><div class="actions"><button id="copy-log">内容をコピー</button><button id="close-dialog" class="primary">閉じる</button></div></dialog>
<script src="/app.js" type="module"></script></body></html>
